<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        body{
            margin: 2% ;
        }
        header{
            background-color: #22C1C3;
            height: 60vh;
        }
        .wrapper{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2% 0;

        }
        section{
            background-color: #1467a3;
            width: 32%;
            height: 50vh;
            align-items: center;
            display: flex;}
        footer{
            background-color: #22C1C3;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        header, section, footer{
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Avenir', Helvetica, Arial, sans-serif;
            font-size: 50px;

        }

    </style>
</head>
<body>
<header><p> Widgets</p></header>
<div class="wrapper">
    <section><p>Big Widgets</p></section>
    <section><p>Bigger Widgets</p></section>
    <section><p> Huge Widgets</p></section>
</div>
<footer><p>Contact</p></footer>

</body>
</html>
